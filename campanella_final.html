<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Campanella — Baby & Kids Boutique</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Raleway:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --beige:#f7f3ee;--offwhite:#FAFAF8;--shadow:#212c5a;--gold:#C9A96E;
  --rose:#D4A5A5;--sage:#9CAF88;--gold-light:#E8D5A3;--gold-dark:#A87C2A;
  --bg:#f7f3ee;--surface:#FAFAF8;--border:#e8e0d5;--text:#212c5a;
  --text-muted:#8a8070;--accent:#C9A96E;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Raleway',sans-serif;min-height:100vh;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--beige);}
::-webkit-scrollbar-thumb{background:var(--gold-light);border-radius:3px;}

/* HEADER */
.header{background:var(--shadow);padding:0 20px;display:flex;align-items:center;position:sticky;top:0;z-index:100;overflow-x:auto;gap:0;}
.brand{padding:16px 0;margin-right:28px;flex-shrink:0;text-align:center;line-height:1;}
.brand-name{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:var(--gold);letter-spacing:1px;display:block;}
.brand-tag{font-family:'Raleway',sans-serif;font-size:8px;color:var(--gold-light);letter-spacing:4px;text-transform:uppercase;display:block;margin-top:1px;}
.tabs{display:flex;gap:0;}
.tab-btn{padding:18px 14px;border:none;background:transparent;color:rgba(232,213,163,.5);font-weight:500;font-size:11px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-family:'Raleway',sans-serif;letter-spacing:1.5px;text-transform:uppercase;transition:all .2s;}
.tab-btn:hover{color:var(--gold-light);}
.tab-btn.active{color:var(--gold);border-bottom:2px solid var(--gold);}

/* BODY */
.body{padding:24px 20px;max-width:1200px;margin:0 auto;}
.page-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:28px;color:var(--shadow);margin-bottom:4px;}
.page-sub{font-size:11px;color:var(--text-muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:24px;}

/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px;}
.stat{background:var(--surface);border-radius:12px;padding:20px;border:1px solid var(--border);position:relative;overflow:hidden;}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-light));}
.stat-icon{position:absolute;right:14px;top:18px;font-size:22px;opacity:.12;}
.stat-label{font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:2px;font-weight:600;margin-bottom:8px;}
.stat-val{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--shadow);}

/* CARDS */
.card{background:var(--surface);border-radius:14px;padding:22px;border:1px solid var(--border);margin-bottom:18px;}
.card h3{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;color:var(--shadow);margin-bottom:16px;font-weight:400;}

/* ROWS */
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:10px;margin-bottom:6px;border:1px solid var(--border);gap:8px;flex-wrap:wrap;background:var(--bg);}
.row:hover{border-color:var(--gold-light);background:var(--offwhite);}

/* BADGES */
.badge{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap;letter-spacing:.5px;font-family:'Raleway',sans-serif;}
.badge-talla{background:var(--shadow);color:var(--gold-light);}
.badge-price{background:rgba(201,169,110,.12);color:var(--gold-dark);border:1px solid var(--gold-light);}
.badge-qty{background:rgba(33,44,90,.08);color:var(--shadow);}
.badge-qty-low{background:rgba(212,165,165,.2);color:#8b3a3a;border:1px solid var(--rose);}
.badge-ok{background:rgba(156,175,136,.15);color:#4a6a38;border:1px solid var(--sage);}
.badge-cat{background:var(--beige);color:var(--text-muted);border:1px solid var(--border);}
.badge-genero-f{background:rgba(212,165,165,.15);color:#7a3a5a;}
.badge-genero-m{background:rgba(33,44,90,.08);color:var(--shadow);}
.badge-genero-u{background:rgba(156,175,136,.15);color:#4a6a38;}

/* BUTTONS */
.btn{padding:10px 22px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:11px;font-family:'Raleway',sans-serif;letter-spacing:1.5px;text-transform:uppercase;transition:all .2s;}
.btn-primary{background:var(--shadow);color:var(--gold-light);}
.btn-primary:hover{background:#2d3a6e;}
.btn-gold{background:var(--gold);color:#fff;}
.btn-gold:hover{background:var(--gold-dark);}
.btn-sm{padding:5px 10px;font-size:10px;border-radius:6px;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text-muted);}
.btn-outline:hover{border-color:var(--gold);color:var(--shadow);}
.btn-danger{background:rgba(212,165,165,.2);color:#8b3a3a;border:1px solid var(--rose);}

/* INPUTS */
.inp-group{margin-bottom:14px;}
.inp-group label{font-size:9px;color:var(--text-muted);display:block;margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;}
.inp-group input,.inp-group select{width:100%;padding:10px 13px;border-radius:8px;border:1px solid var(--border);background:var(--offwhite);color:var(--text);font-size:13px;font-family:'Raleway',sans-serif;transition:border-color .2s;}
.inp-group input:focus,.inp-group select:focus{outline:none;border-color:var(--gold);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(33,44,90,.3);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:var(--offwhite);border-radius:16px;padding:30px;width:100%;max-width:500px;border:1px solid var(--border);max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(33,44,90,.15);}
.modal-box h3{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:var(--shadow);margin-bottom:22px;font-weight:400;}

/* MISC */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.info-box{border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:13px;font-family:'Raleway',sans-serif;}
.hidden{display:none;}
.divider{height:1px;background:var(--border);margin:14px 0;}
.alerta-row{border-radius:10px;padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;background:rgba(212,165,165,.1);border:1px solid var(--rose);}
.search-bar{width:100%;padding:11px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-family:'Raleway',sans-serif;transition:border-color .2s;margin-bottom:12px;}
.search-bar:focus{outline:none;border-color:var(--gold);}
.filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.filter-sel{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;font-family:'Raleway',sans-serif;}
.count-label{font-size:11px;color:var(--text-muted);margin-bottom:12px;letter-spacing:.5px;}
canvas{max-height:220px;}
.empty{text-align:center;padding:40px;color:var(--text-muted);font-style:italic;font-family:'Cormorant Garamond',serif;font-size:17px;}
.tag-etiqueta{font-size:9px;color:var(--sage);letter-spacing:.5px;}
.tag-no-etiqueta{font-size:9px;color:var(--rose);letter-spacing:.5px;}
.fin-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
.top-rank{width:24px;height:24px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--shadow);}
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <span class="brand-name">Campanella</span>
    <span class="brand-tag">Baby &amp; Kids Boutique</span>
  </div>
  <div class="tabs" id="tabs"></div>
</div>

<div class="body" id="app"></div>

<!-- MODAL VENTA -->
<div class="modal-overlay hidden" id="modalVenta">
  <div class="modal-box">
    <h3>Registrar Venta</h3>
    <div class="inp-group"><label>Prenda</label><select id="vItemId" onchange="updateVentaInfo()"></select></div>
    <div id="vItemInfo" class="info-box hidden" style="background:rgba(201,169,110,.08);border:1px solid var(--gold-light);color:var(--text-muted);"></div>
    <div class="grid2">
      <div class="inp-group"><label>Cantidad</label><input type="number" id="vQty" min="1" value="1" oninput="updateVentaInfo()"/></div>
      <div class="inp-group"><label>Fecha</label><input type="date" id="vFecha"/></div>
    </div>
    <div class="inp-group"><label>Cliente (opcional)</label><input type="text" id="vCliente" placeholder="Nombre del cliente"/></div>
    <div id="vTotal" class="info-box hidden" style="background:rgba(156,175,136,.1);border:1px solid var(--sage);color:var(--text);"></div>
    <div class="flex">
      <button class="btn btn-primary" onclick="regVenta()">Confirmar venta</button>
      <button class="btn btn-outline" onclick="closeModal('modalVenta')">Cancelar</button>
    </div>
  </div>
</div>

<!-- MODAL CAJA -->
<div class="modal-overlay hidden" id="modalCaja">
  <div class="modal-box">
    <h3>Movimiento de Caja</h3>
    <div class="inp-group"><label>Tipo</label>
      <select id="cTipo"><option value="ingreso">Ingreso ↑</option><option value="egreso">Egreso ↓</option></select>
    </div>
    <div class="grid2">
      <div class="inp-group"><label>Monto (Bs)</label><input type="number" id="cMonto" placeholder="0"/></div>
      <div class="inp-group"><label>Fecha</label><input type="date" id="cFecha"/></div>
    </div>
    <div class="inp-group"><label>Concepto</label><input type="text" id="cConcepto" placeholder="Ej: Pago proveedor"/></div>
    <div class="inp-group"><label>Categoría</label>
      <select id="cCategoria"><option>Ventas</option><option>Proveedor</option><option>Stock</option><option>Gastos operativos</option><option>Transporte</option><option>Otro</option></select>
    </div>
    <div class="flex">
      <button class="btn btn-primary" onclick="regCaja()">Guardar</button>
      <button class="btn btn-outline" onclick="closeModal('modalCaja')">Cancelar</button>
    </div>
  </div>
</div>

<!-- MODAL INVENTARIO -->
<div class="modal-overlay hidden" id="modalInv">
  <div class="modal-box">
    <h3 id="modalInvTitle">Nueva Prenda</h3>
    <input type="hidden" id="iEditId"/>
    <div class="grid2">
      <div class="inp-group"><label>Categoría</label>
        <select id="iCat"><option>Baby</option><option>toddler - girl</option><option>Toddler - boy</option><option>Kid - girl</option><option>Kid - boy</option><option>Teen - girl</option><option>Teen - boy</option></select>
      </div>
      <div class="inp-group"><label>Género</label>
        <select id="iGenero"><option>Niña</option><option>Niño</option><option>Unisex</option></select>
      </div>
    </div>
    <div class="inp-group"><label>Tipo de Prenda</label><input type="text" id="iTipo" placeholder="Ej: Vestido casual"/></div>
    <div class="grid2">
      <div class="inp-group"><label>Marca</label><input type="text" id="iMarca" placeholder="Carter's, Disney..."/></div>
      <div class="inp-group"><label>Talla</label><input type="text" id="iTalla" placeholder="3M, 2T, 5..."/></div>
    </div>
    <div class="grid3">
      <div class="inp-group"><label>Costo (Bs)</label><input type="number" id="iCosto" oninput="updateMargen()"/></div>
      <div class="inp-group"><label>Precio Venta (Bs)</label><input type="number" id="iVenta" oninput="updateMargen()"/></div>
      <div class="inp-group"><label>Piezas</label><input type="number" id="iQty" value="1" min="0"/></div>
    </div>
    <div class="grid2">
      <div class="inp-group"><label>Condición</label>
        <select id="iCondicion"><option>Excelente</option><option>Buena</option><option>Regular</option></select>
      </div>
      <div class="inp-group"><label>¿Tiene etiqueta?</label>
        <select id="iEtiqueta"><option value="Si">Sí</option><option value="No">No</option></select>
      </div>
    </div>
    <div id="margenBox" class="info-box hidden" style="background:rgba(201,169,110,.08);border:1px solid var(--gold-light);color:var(--gold-dark);font-size:13px;"></div>
    <div class="flex">
      <button class="btn btn-primary" onclick="guardarInv()">Guardar</button>
      <button class="btn btn-outline" onclick="closeModal('modalInv')">Cancelar</button>
    </div>
  </div>
</div>

// ── STATS ─────────────────────────────────────────────────────────────────────
const stats = () => {
  const totalStock = inv.reduce((s,i)=>s+i.qty,0);
  const inversion  = inv.reduce((s,i)=>s+i.costo*i.qty,0);
  const potencial  = inv.reduce((s,i)=>s+i.venta*i.qty,0);
  const totalVen   = ven.reduce((s,v)=>s+v.precio*v.qty,0);
  const costoVen   = ven.reduce((s,v)=>s+v.costo*v.qty,0);
  const ingresos   = caja.filter(c=>c.tipo==='ingreso').reduce((s,c)=>s+c.monto,0);
  const egresos    = caja.filter(c=>c.tipo==='egreso').reduce((s,c)=>s+c.monto,0);
  return {totalStock,inversion,potencial,totalVen,costoVen,ganancia:totalVen-costoVen,
    ingresos,egresos,saldo:ingresos-egresos,stockBajo:inv.filter(i=>i.qty<=stockMin&&i.qty>0)};
};

    return `<button class="tab-btn ${currentTab===t.id?'active':''}" onclick="goTab('${t.id}')">${lbl}</button>`;
  }).join('');
}

      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div class="card" style="margin:0">
          <h3>Top tipos más vendidos</h3>
          ${topTipos.length===0?`<div class="empty">Sin datos</div>`:topTipos.map(([tipo,qty],i)=>`
            <div class="fin-row">
              <div style="display:flex;gap:10px;align-items:center">
                <div class="top-rank">${i+1}</div><span style="font-size:13px">${tipo}</span>
              </div>
              <span class="badge badge-qty">${qty} uds</span>
            </div>`).join('')}
        </div>
        <div class="card" style="margin:0">
          <h3>Marcas con más stock</h3>
          ${topMarcas.map(([marca,qty],i)=>`
            <div class="fin-row">
              <div style="display:flex;gap:10px;align-items:center">
                <div class="top-rank">${i+1}</div><span style="font-size:13px">${marca}</span>
              </div>
              <span class="badge badge-qty">${qty} uds</span>
            </div>`).join('')}
        </div>
      </div>`;
    drawBar('chartBar'); drawGen('chartGen');

  // ── ALERTAS ──
  } else if(currentTab==='alertas'){
    app.innerHTML=`
      <div class="page-title" style="margin-bottom:4px">Alertas de Stock</div>
      <div class="page-sub" style="margin-bottom:24px">Prendas con poca cantidad disponible</div>
      <div class="card">
        <div class="flex" style="margin-bottom:16px">
          <span style="font-size:13px;color:var(--text-muted)">Alertar cuando queden ≤</span>
          <input type="number" id="stockMinInput" value="${stockMin}" min="1" max="20" onchange="setStockMin(this.value)"
            style="width:55px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--offwhite);color:var(--text);font-size:14px;text-align:center;font-family:'Raleway',sans-serif"/>
          <span style="font-size:13px;color:var(--text-muted)">unidades</span>
        </div>
        ${st.stockBajo.length===0
          ? `<div class="empty" style="color:var(--sage)">✓ Todo el stock está en buen nivel</div>`
          : st.stockBajo.map(i=>`<div class="alerta-row">
              <div>
                <div style="font-weight:600">${i.tipo} <span style="font-size:11px;color:var(--text-muted)">${i.marca}</span></div>
                <div style="font-size:11px;color:var(--text-muted);margin-top:2px">${i.id} · ${catBadge(i.cat)} ${genBadge(i.gen)} · Talla ${i.talla} · ${bs(i.venta)}</div>
              </div>
              <span class="badge badge-qty-low">Solo ${i.qty} pza${i.qty!==1?'s':''}</span>
            </div>`).join('')}
      </div>`;
  }
}

// ── CHARTS ────────────────────────────────────────────────────────────────────
Chart.defaults.font.family = "'Raleway',sans-serif";
Chart.defaults.color = '#8a8070';

function tendData(){
  const m={};
  ven.forEach(v=>{m[v.fecha]=(m[v.fecha]||0)+v.precio*v.qty;});
  const s=Object.entries(m).sort(([a],[b])=>a.localeCompare(b));
  return {labels:s.map(([f])=>f.slice(5)),data:s.map(([,t])=>t)};
}
function drawLine(id){
  const el=document.getElementById(id); if(!el) return;
  const {labels,data}=tendData();
  if(!labels.length){el.parentElement.innerHTML+='<div class="empty">Sin ventas aún</div>';return;}
  charts[id]=new Chart(el,{type:'line',data:{labels,datasets:[{label:'Bs',data,borderColor:P.gold,backgroundColor:'rgba(201,169,110,.08)',borderWidth:2,tension:.4,fill:true,pointBackgroundColor:P.gold,pointRadius:3}]},
    options:{plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(0,0,0,.05)'}},y:{grid:{color:'rgba(0,0,0,.05)'}}}}});
}
function drawBar(id){
  const el=document.getElementById(id); if(!el) return;
  const {labels,data}=tendData();
  if(!labels.length){el.parentElement.innerHTML+='<div class="empty">Sin ventas aún</div>';return;}
  charts[id]=new Chart(el,{type:'bar',data:{labels,datasets:[{label:'Bs',data,backgroundColor:'rgba(201,169,110,.5)',borderColor:P.gold,borderWidth:1,borderRadius:4}]},
    options:{plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(0,0,0,.05)'}},y:{grid:{color:'rgba(0,0,0,.05)'}}}}});
}
function drawCat(id){
  const el=document.getElementById(id); if(!el) return;
  const m={};
  inv.forEach(i=>{m[i.cat]=(m[i.cat]||0)+i.qty;});
  const entries=Object.entries(m).sort(([,a],[,b])=>b-a);
  const colors=[P.gold,'#9CAF88','#D4A5A5','#212c5a','#E8D5A3','#A87C2A','#c5b5a0'];
  charts[id]=new Chart(el,{type:'doughnut',data:{labels:entries.map(([c])=>c),datasets:[{data:entries.map(([,v])=>v),backgroundColor:colors,borderWidth:0}]},
    options:{plugins:{legend:{position:'bottom',labels:{boxWidth:10,padding:10,font:{size:10}}}},cutout:'60%'}});
}
function drawGen(id){
  const el=document.getElementById(id); if(!el) return;
  const m={Niña:0,Niño:0,Unisex:0};
  inv.forEach(i=>{if(m[i.gen]!==undefined)m[i.gen]+=i.qty;});
  charts[id]=new Chart(el,{type:'doughnut',data:{labels:Object.keys(m),datasets:[{data:Object.values(m),backgroundColor:[P.rose,P.shadow,P.sage],borderWidth:0}]},
    options:{plugins:{legend:{position:'bottom',labels:{boxWidth:10,padding:10,font:{size:10}}}},cutout:'55%'}});
}

// ── INVENTARIO ACTIONS ────────────────────────────────────────────────────────
function filterInv(){
  const q=(document.getElementById('searchInv')?.value||'').toLowerCase();
  const fCat=document.getElementById('fCat')?.value||'';
  const fGen=document.getElementById('fGen')?.value||'';
  const fCond=document.getElementById('fCond')?.value||'';
  const filtered=inv.filter(i=>{
    const ms=i.id.toLowerCase().includes(q)||i.tipo.toLowerCase().includes(q)||i.marca.toLowerCase().includes(q)||i.talla.toLowerCase().includes(q);
    return ms&&(!fCat||i.cat===fCat)&&(!fGen||i.gen===fGen)&&(!fCond||i.cond===fCond);
  });
  const cnt=document.getElementById('invCount');
  if(cnt) cnt.textContent=`${filtered.length} prenda${filtered.length!==1?'s':''} encontrada${filtered.length!==1?'s':''}`;
  const list=document.getElementById('invList');
  if(!list) return;
  list.innerHTML=filtered.map(i=>`<div class="row" style="${i.qty<=stockMin&&i.qty>0?'border-color:var(--rose);':''}">
    <div style="flex:1;min-width:200px">
      <div style="font-weight:600;font-size:13px">${i.tipo} <span style="font-size:10px;font-family:monospace;color:var(--text-muted)">${i.id}</span></div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:3px">${i.marca} · ${catBadge(i.cat)} ${genBadge(i.gen)} ${condBadge(i.cond)}
        <span class="${i.etiq==='Si'?'tag-etiqueta':'tag-no-etiqueta'}">${i.etiq==='Si'?'✓ etiqueta':'sin etiqueta'}</span>
      </div>
    </div>
    <div class="flex">
      <span class="badge badge-talla">${i.talla}</span>
      <span class="badge badge-price">${bs(i.venta)}</span>
      <span class="badge ${i.qty<=stockMin&&i.qty>0?'badge-qty-low':'badge-qty'}">×${i.qty}</span>
      <button class="btn btn-sm btn-outline" onclick="editInv('${i.id}')">✎</button>
      <button class="btn btn-sm btn-danger" onclick="delInv('${i.id}')">×</button>
    </div>
  </div>`).join('') || `<div class="empty">No se encontraron prendas</div>`;
}

function newInv(){
  document.getElementById('modalInvTitle').textContent='Nueva Prenda';
  document.getElementById('iEditId').value='';
  ['iTipo','iMarca','iTalla'].forEach(id=>{document.getElementById(id).value='';});
  document.getElementById('iCosto').value='38';
  document.getElementById('iVenta').value='';
  document.getElementById('iQty').value='1';
  document.getElementById('iCat').value='Baby';
  document.getElementById('iGenero').value='Niña';
  document.getElementById('iCondicion').value='Excelente';
  document.getElementById('iEtiqueta').value='Si';
  document.getElementById('margenBox').classList.add('hidden');
  openModal('modalInv');
}

function editInv(id){
  const item=inv.find(i=>i.id===id); if(!item) return;
  document.getElementById('modalInvTitle').textContent='Editar Prenda';
  document.getElementById('iEditId').value=id;
  document.getElementById('iCat').value=item.cat;
  document.getElementById('iGenero').value=item.gen;
  document.getElementById('iTipo').value=item.tipo;
  document.getElementById('iMarca').value=item.marca;
  document.getElementById('iTalla').value=item.talla;
  document.getElementById('iCosto').value=item.costo;
  document.getElementById('iVenta').value=item.venta;
  document.getElementById('iQty').value=item.qty;
  document.getElementById('iCondicion').value=item.cond;
  document.getElementById('iEtiqueta').value=item.etiq;
  updateMargen();
  openModal('modalInv');
}

function guardarInv(){
  const tipo=document.getElementById('iTipo').value.trim();
  const costo=Number(document.getElementById('iCosto').value);
  const venta=Number(document.getElementById('iVenta').value);
  const qty=Number(document.getElementById('iQty').value);
  if(!tipo||!costo||!venta) return alert('Completá tipo de prenda, costo y precio de venta.');
  const editId=document.getElementById('iEditId').value;
  const datos={cat:document.getElementById('iCat').value,gen:document.getElementById('iGenero').value,
    tipo,marca:document.getElementById('iMarca').value,talla:document.getElementById('iTalla').value,
    costo,venta,qty,cond:document.getElementById('iCondicion').value,etiq:document.getElementById('iEtiqueta').value};
  if(editId){inv=inv.map(i=>i.id===editId?{...i,...datos}:i);}
  else{iN++;inv.push({id:`CAM-NEW-${String(iN).padStart(3,'0')}`,...datos});save('camp_iN',iN);}
  save('camp_inv',inv);
  closeModal('modalInv');
  renderApp(); renderTabs();
}

function delInv(id){
  if(!confirm('¿Eliminar esta prenda del inventario?')) return;
  inv=inv.filter(i=>i.id!==id); save('camp_inv',inv);
  renderApp(); renderTabs();
}

function updateMargen(){
  const c=Number(document.getElementById('iCosto')?.value);
  const v=Number(document.getElementById('iVenta')?.value);
  const box=document.getElementById('margenBox');
  if(c&&v&&box){
    box.classList.remove('hidden');
    box.innerHTML=`Ganancia: <strong>${bs(v-c)}</strong> · Margen: <strong>${c>0?Math.round(((v-c)/c)*100):0}%</strong>`;
  } else if(box) box.classList.add('hidden');
}

// ── VENTA ACTIONS ─────────────────────────────────────────────────────────────
function openModal(id){
  if(id==='modalVenta'){
    const sel=document.getElementById('vItemId');
    sel.innerHTML='<option value="">— Seleccioná una prenda —</option>'+
      inv.filter(i=>i.qty>0).map(i=>`<option value="${i.id}">${i.id} · ${i.tipo} (${i.talla}) ${i.marca} — ${i.qty} disp. — ${bs(i.venta)}</option>`).join('');
    document.getElementById('vFecha').value=hoy();
    document.getElementById('vQty').value=1;
    document.getElementById('vCliente').value='';
    document.getElementById('vItemInfo').classList.add('hidden');
    document.getElementById('vTotal').classList.add('hidden');
  }
  if(id==='modalCaja') document.getElementById('cFecha').value=hoy();
  document.getElementById(id).classList.remove('hidden');
}

function updateVentaInfo(){
  const id=document.getElementById('vItemId').value;
  const item=inv.find(i=>i.id===id);
  const qty=Number(document.getElementById('vQty').value)||1;
  const info=document.getElementById('vItemInfo');
  const tot=document.getElementById('vTotal');
  if(item){
    info.classList.remove('hidden');
    info.innerHTML=`<strong>${item.tipo}</strong> · ${item.marca} · Talla ${item.talla}<br>Precio: <strong>${bs(item.venta)}</strong> · Costo: ${bs(item.costo)} · Ganancia/ud: <strong>${bs(item.venta-item.costo)}</strong>`;
    tot.classList.remove('hidden');
    tot.innerHTML=`Total a cobrar: <strong style="font-size:16px;color:var(--gold-dark)">${bs(item.venta*qty)}</strong> · Ganancia: ${bs((item.venta-item.costo)*qty)}`;
  } else {info.classList.add('hidden');tot.classList.add('hidden');}
}

function regVenta(){
  const id=document.getElementById('vItemId').value;
  const item=inv.find(i=>i.id===id);
  const qty=Number(document.getElementById('vQty').value);
  if(!item) return alert('Seleccioná una prenda.');
  if(qty<1||qty>item.qty) return alert(`Cantidad inválida. Disponibles: ${item.qty}`);
  vN++;cN++;
  const nv={id:`V-${String(vN).padStart(4,'0')}`,fecha:document.getElementById('vFecha').value,
    itemId:item.id,tipo:item.tipo,marca:item.marca,talla:item.talla,cat:item.cat,
    qty,precio:item.venta,costo:item.costo,cliente:document.getElementById('vCliente').value||'Sin nombre'};
  ven.unshift(nv);
  inv=inv.map(i=>i.id===item.id?{...i,qty:i.qty-qty}:i);
  caja.unshift({id:`C-${String(cN).padStart(4,'0')}`,fecha:nv.fecha,tipo:'ingreso',
    monto:item.venta*qty,concepto:`Venta: ${item.tipo} x${qty}`,categoria:'Ventas'});
  save('camp_inv',inv);save('camp_ven',ven);save('camp_caja',caja);
  save('camp_vN',vN);save('camp_cN',cN);
  closeModal('modalVenta');
  renderApp(); renderTabs();
}

function regCaja(){
  const monto=Number(document.getElementById('cMonto').value);
  const concepto=document.getElementById('cConcepto').value.trim();
  if(!monto||!concepto) return alert('Completá monto y concepto.');
  cN++;
  caja.unshift({id:`C-${String(cN).padStart(4,'0')}`,fecha:document.getElementById('cFecha').value,
    tipo:document.getElementById('cTipo').value,monto,concepto,categoria:document.getElementById('cCategoria').value});
  save('camp_caja',caja);save('camp_cN',cN);
  closeModal('modalCaja');renderApp();
}

function delCaja(id){
  if(!confirm('¿Eliminar este movimiento?')) return;
  caja=caja.filter(c=>c.id!==id);save('camp_caja',caja);renderApp();
}

function setStockMin(v){stockMin=Number(v)||1;save('camp_smin',stockMin);renderTabs();}
function closeModal(id){document.getElementById(id).classList.add('hidden');}

// ── INIT ──────────────────────────────────────────────────────────────────────
renderTabs();
renderApp();
</script>
</body>
</html>
